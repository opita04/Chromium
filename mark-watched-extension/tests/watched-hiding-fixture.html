<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mark Watched hiding fixture</title>
</head>
<body>
  <ytd-rich-item-renderer id="expired-video">
    <a id="thumbnail" href="https://www.youtube.com/watch?v=expired001">Expired video</a>
  </ytd-rich-item-renderer>
  <ytd-rich-item-renderer id="recent-video">
    <a id="thumbnail" href="https://www.youtube.com/watch?v=recent001">Recent video</a>
  </ytd-rich-item-renderer>
  <yt-lockup-view-model id="modern-recent-video">
    <a class="ytLockupViewModelContentImage" href="https://www.youtube.com/watch?v=recent002">Modern recent video</a>
  </yt-lockup-view-model>

  <script>
    const now = Date.now();
    const extensionStorage = {
      watchedVideos: JSON.stringify({
        // Deliberately unsorted to prove cleanup checks every entry.
        entries: {
          recent001: now - (30 * 24 * 60 * 60 * 1000),
          recent002: now - (10 * 24 * 60 * 60 * 1000),
          expired001: now - (366 * 24 * 60 * 60 * 1000)
        },
        index: ['recent001', 'recent002', 'expired001']
      })
    };
    globalThis.chrome = {
      runtime: {},
      storage: {
        local: {
          get(keys, callback) {
            const result = {};
            keys.forEach(key => { result[key] = extensionStorage[key]; });
            callback(result);
          },
          set(values) {
            Object.assign(extensionStorage, values);
            return Promise.resolve();
          }
        }
      }
    };
    localStorage.setItem('MWYV_STATE_misc', 'hidden');
  </script>
  <script src="../src/content.js"></script>
</body>
</html>
